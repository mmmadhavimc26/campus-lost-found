name: Keep site awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: campus-site-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HEALTHCHECK_URL: https://campus-lost-found-7pw0.onrender.com/api/health
    steps:
      - name: Ping the application
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ['HEALTHCHECK_URL']
          request = urllib.request.Request(url, headers={
              'Accept': 'application/json',
              'Cache-Control': 'no-cache',
              'User-Agent': 'CampusLostFound-HealthCheck'
          })

          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError(f'HTTP {response.status}')
                      payload = json.loads(response.read(65536))
                  if not isinstance(payload, dict) or payload.get('status') != 'UP':
                      raise ValueError('The health endpoint did not report UP')
                  print('Health check passed: the application is UP.')
                  break
              except (urllib.error.URLError, TimeoutError, OSError, ValueError) as error:
                  print(f'Attempt {attempt}/6 failed: {error}', flush=True)
                  if attempt == 6:
                      raise SystemExit('Health check failed after six attempts.')
                  time.sleep(20)
          PY
